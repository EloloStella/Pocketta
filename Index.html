<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Pocketa</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <h1>👛 Pocketa</h1>

            <p>Welcome back.</p>

            <h2>Sign In</h2>

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >

            <br><br>

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >

            <br><br>

            <a href="home.html">
    <button type="button">Sign In</button>
</a>
          
          <p style="font-size: 14px !important; font-weight: normal !important; text-align: center; margin-top: 20px;">
    Don't have an account?
    <a href="signup.html" style="font-size: 14px !important; font-weight: normal !important; color: #2196f3; text-decoration: underline;">
        Sign up
    </a>
</p>

        </section>

    </main>

</body>

</html>
